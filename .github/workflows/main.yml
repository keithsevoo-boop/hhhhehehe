
name: PrismOS 1.0 APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PrismOS Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PrismOS project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for PrismOS Android project..."

          find . -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*"

          PROJECT_FILE=$(find . -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No Android Gradle project found."
            echo "Upload the PrismOS source files,"
            echo "including settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Found project: $PROJECT_DIR"
          echo "directory=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build PrismOS APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: |
          cd "$PROJECT_DIR"

          echo "Building PrismOS in $(pwd)"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Collect PrismOS APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: |
          mkdir -p release

          APK=$(find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Build finished but no APK was found."
            exit 1
          fi

          cp "$APK" release/PrismOS-1.0-debug.apk

          echo "PrismOS APK prepared successfully."
          ls -lh release/

      - name: Upload PrismOS APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismOS-1.0-Android-APK
          path: release/PrismOS-1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## PrismOS 1.0 Build Successful" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section." \
            >> "$GITHUB_STEP_SUMMARY"
