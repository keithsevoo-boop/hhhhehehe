
name: PrismOS 1.0 APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PrismOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PrismOS source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Display build environment
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_HOME"

      - name: Build PrismOS Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Rename PrismOS APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          cp "$APK" release/PrismOS-1.0-debug.apk

      - name: Upload PrismOS APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismOS-1.0-Android-APK
          path: release/PrismOS-1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
